name: ci_pinetab2

# PineTab 2 (rk3566) U-Boot chain: TF-A bl31 (rk3568 plat covers rk3566) +
# rkbin TPL (rk3566 DDR blob) + U-Boot (pinetab2-rk3566_defconfig).
# Produces u-boot-rockchip.bin (SD/eMMC at sector 64) and
# u-boot-rockchip-spi.bin (SPI flash at offset 0).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'

permissions:
  contents: read

jobs:
  build-uboot:
    name: U-Boot pinetab2-rk3566 (bl31 + TPL + BL33)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout u-boot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2 — see PINNED.md

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3 python3-dev python3-pyelftools python3-setuptools \
            device-tree-compiler \
            openssl libssl-dev libgnutls28-dev \
            bison flex bc \
            uuid-dev \
            swig \
            git ca-certificates \
            gcc-aarch64-linux-gnu
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      - name: Fetch TF-A and build bl31 (rk3568 plat covers rk3566)
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/yubi-OS/arm-trusted-firmware.git ../arm-trusted-firmware
          make -C ../arm-trusted-firmware -j"$(nproc)" \
            PLAT=rk3568 ARCH=aarch64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            bl31
          ls -l ../arm-trusted-firmware/build/rk3568/release/bl31/bl31.elf

      - name: Fetch rkbin rk3566 TPL (DDR blob)
        run: |
          set -euxo pipefail
          mkdir -p ../rkbin
          curl -sSL -o ../rkbin/rk3566_ddr.bin \
            "https://raw.githubusercontent.com/rockchip-linux/rkbin/master/bin/rk35/rk3566_ddr_1056MHz_v1.26.bin"
          sha256sum ../rkbin/rk3566_ddr.bin

      - name: Fetch optee_os at rk3568-platform branch (upstream PR #7791)
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/OP-TEE/optee_os.git ../optee_os
          cd ../optee_os
          git fetch --depth 1 origin refs/pull/7791/head:rk3568-pr
          git checkout rk3568-pr
          ls core/arch/arm/plat-rockchip/platform_rk3568.c

      - name: Build OP-TEE (rockchip rk3568 flavor covers rk3566)
        run: |
          set -euxo pipefail
          make -C ../optee_os -j"$(nproc)" \
            PLATFORM=rockchip \
            PLATFORM_FLAVOR=rk356x \
            CFG_ARM64_core=y \
            CFG_USER_TA_TARGETS=ta_arm64 \
            CROSS_COMPILE64="${CROSS_COMPILE}"
          ls -l ../optee_os/out/plat-rockchip/rk356x/core/tee.bin
          cp ../optee_os/out/plat-rockchip/rk356x/core/tee.bin "$GITHUB_WORKSPACE/tee.bin"

      - name: Configure (pinetab2-rk3566_defconfig)
        run: |
          set -euxo pipefail
          make CROSS_COMPILE="${CROSS_COMPILE}" ARCH=arm pinetab2-rk3566_defconfig

      - name: Build U-Boot
        run: |
          set -euxo pipefail
          make -j"$(nproc)" CROSS_COMPILE="${CROSS_COMPILE}" ARCH=arm \
            BL31="../arm-trusted-firmware/build/rk3568/release/bl31/bl31.elf" \
            ROCKCHIP_TPL="../rkbin/rk3566_ddr.bin" \
            TEE="../optee_os/out/plat-rockchip/rk356x/core/tee.bin"
          ls -l u-boot-rockchip.bin u-boot-rockchip-spi.bin idbloader.img u-boot.itb

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4 — see PINNED.md
        with:
          name: u-boot-pinetab2-rk3566
          path: |
            u-boot-rockchip.bin
            u-boot-rockchip-spi.bin
            idbloader.img
            u-boot.itb
            tee.bin
            .config
          if-no-files-found: warn
          retention-days: 30
